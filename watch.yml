name: Bungalow watcher

on:
  schedule:
    - cron: "0 */2 * * *"     # start a fresh run every 2 hours
  workflow_dispatch:           # adds a "Run workflow" button

concurrency:
  group: bungalow-watcher
  cancel-in-progress: true     # new run replaces the old one, so no gaps or duplicates

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bungalow_discord_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: America/New_York
          OPEN_BROWSER: "0"
          QUIET_START: "1"
          RUN_MINUTES: "340"
